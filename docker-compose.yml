# ─────────────────────────────────────────────────────────────
#  InkForum — Docker Compose
#
#  Install:     curl -fsSL https://raw.githubusercontent.com/vokartz/inkforum/main/install.sh | sudo bash
#  Manual:      cp .env.example .env  (edit it)  →  docker compose up -d
#  Setup code:  docker compose logs inkforum | grep "Setup code"
#
#  Updates are installed with one click from the admin panel (Admin → Updates).
# ─────────────────────────────────────────────────────────────
name: inkforum

services:
  inkforum:
    image: ghcr.io/vokartz/inkforum:${INKFORUM_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      UPDATER_URL: http://updater:9000
    ports:
      - "${INKFORUM_BIND:-0.0.0.0}:${INKFORUM_PORT:-3000}:3000"
    volumes:
      - inkforum-storage:/app/storage
    labels:
      inkforum.role: app
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-click updates: pulls the new image, restarts the app with a health check and rolls back
  # on failure. Exposes no ports; it only talks to the app over the internal network with a key.
  updater:
    image: ghcr.io/vokartz/inkforum:${INKFORUM_VERSION:-latest}
    restart: unless-stopped
    command: ["node", "updater.mjs"]
    user: root
    environment:
      # Optional: when empty the app generates the key in the shared storage volume
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      UPDATER_IMAGE: ghcr.io/vokartz/inkforum
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - inkforum-storage:/app/storage:ro
    labels:
      inkforum.role: updater
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # Optional: automatic HTTPS (Let's Encrypt). Set DOMAIN=forum.example.com and
  # COMPOSE_PROFILES=https in .env, and INKFORUM_BIND=127.0.0.1.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${DOMAIN:-localhost}", "--to", "inkforum:3000"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Optional: PostgreSQL. In .env set COMPOSE_PROFILES=postgres (or https,postgres),
  # DB_DRIVER=postgres and DATABASE_URL=postgres://inkforum:${POSTGRES_PASSWORD}@postgres:5432/inkforum
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkforum
      POSTGRES_DB: inkforum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkforum}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkforum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inkforum-storage:
  caddy-data:
  caddy-config:
  postgres-data:
