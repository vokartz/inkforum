name: ✨ Feature request
description: Suggest a new feature or an improvement. (Türkçe yazabilirsiniz.)
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Great ideas make InkForum better for every community. Please describe the **problem** first — the best solution often looks different from the first idea.
        Check the [roadmap and existing requests](https://github.com/vokartz/inkforum/issues?q=is%3Aissue+label%3Aenhancement) and 👍 them instead of opening duplicates.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Forum
        - Members / groups / permissions
        - Moderation
        - Themes & appearance
        - Studio (page builder)
        - Plugins
        - Admin panel
        - Installer / updates / backups
        - Security
        - SEO / sharing
        - API / integrations
        - Import from another forum
        - Translations
        - Mobile
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected and how? ("As a forum owner running a role-play server, I can't …")
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mock-ups and screenshots are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and examples
      description: Workarounds you use today, or how other forum software (SMF, phpBB, IPS, XenForo, Discourse…) handles it.

  - type: dropdown
    id: importance
    attributes:
      label: How important is this for you?
      options:
        - Nice to have
        - Important — it would really improve my community
        - Blocking — I can't switch to / keep using InkForum without it
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can test a beta build of this feature.
        - label: I can help with translations / documentation for it.
